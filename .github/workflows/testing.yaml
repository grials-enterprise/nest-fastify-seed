name: CI

run-name: CI on ${{ github.head_ref || github.ref_name }} by @${{ github.actor }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:unit

